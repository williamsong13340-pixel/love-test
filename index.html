<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>亲密关系质量与伴侣特质深度评估量表</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* --- 现代色彩与背景定义 --- */
        :root {
            --primary: #d81b60;
            --primary-light: #ff758c;
            --primary-gradient: linear-gradient(135deg, #ff758c, #ff7eb3);
            --bg-gradient: linear-gradient(120deg, #fdf3f6 0%, #fff1f4 100%);
            --text-main: #4a3b3e;
            --text-sub: #8a7378;
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px 15px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            /* 弥散光背景装饰 */
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; z-index: -1; filter: blur(60px); opacity: 0.6;
        }
        body::before { width: 300px; height: 300px; background: #ffe4e9; top: -50px; left: -50px; }
        body::after { width: 250px; height: 250px; background: #fad0c4; bottom: -50px; right: -50px; }

        /* --- 核心容器 (毛玻璃卡片风格) --- */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(216, 27, 96, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            position: relative; 
            padding-bottom: 70px; 
        }

        /* --- 标题与排版 --- */
        h1 { 
            text-align: center; 
            font-size: 24px; 
            margin-bottom: 8px; 
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { text-align: center; color: var(--text-sub); font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }

        /* --- 现代按钮 --- */
        .btn { 
            display: block; width: 100%; padding: 16px; border: none; border-radius: 16px; 
            font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-align: center; color: white; box-sizing: border-box; letter-spacing: 1px;
        }
        .btn-pink-light { 
            background: white; color: var(--primary); border: 1px solid #f8cdda;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.1);
        }
        .btn-pink-light:active { background: #fff0f4; transform: scale(0.98); }
        .btn-pink-dark { 
            background: var(--primary-gradient); 
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3); 
            margin-top: 35px; 
        }
        .btn-pink-dark:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(255, 117, 140, 0.2); }
        .btn:disabled { background: #e0e0e0; box-shadow: none; color: #999; transform: none; }

        /* --- 验证界面 --- */
        #auth-screen { text-align: center; padding: 10px 0; }
        .disclaimer-box { 
            background: rgba(255, 255, 255, 0.7); border: 1px solid #f8cdda; padding: 16px; 
            border-radius: 16px; font-size: 13px; color: var(--text-sub); line-height: 1.7; 
            margin-bottom: 30px; text-align: left; 
        }
        .disclaimer-box strong { color: var(--primary); }
        .lock-icon { font-size: 56px; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .auth-input { 
            width: 100%; max-width: 320px; padding: 18px; font-size: 18px; text-align: center; 
            border: 2px solid #f8cdda; border-radius: 16px; margin-bottom: 25px; 
            text-transform: uppercase; letter-spacing: 3px; outline: none; transition: 0.3s; 
            background: white; color: var(--primary); font-weight: 800; box-sizing: border-box;
        }
        .auth-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(255, 117, 140, 0.1); }
        .auth-input::placeholder { font-weight: 400; font-size: 14px; letter-spacing: 1px; color: #ccc;}

        /* --- 答题界面 (卡片式选项) --- */
        #quiz-screen { display: none; }
        .intro { 
            background: rgba(255, 117, 140, 0.05); padding: 16px; border-radius: 16px; 
            margin-bottom: 30px; font-size: 14px; color: var(--primary); 
            border: 1px solid rgba(255, 117, 140, 0.2); line-height: 1.6;
        }
        .question { 
            margin-top: 25px; padding-bottom: 20px; border-bottom: 1px dashed #f0d5db; scroll-margin-top: 20px;
        }
        .question:last-of-type { border-bottom: none; }
        .question.error-highlight {
            background: rgba(216, 27, 96, 0.05); border-radius: 12px; padding: 15px; border-bottom: none;
            box-shadow: 0 0 0 1px var(--primary);
        }
        .question h4 { margin: 0 0 15px 0; color: var(--text-main); font-size: 16px; line-height: 1.5; font-weight: 600;}
        
        /* 隐藏原生单选框，使用自定义卡片 UI */
        .options-wrapper { display: flex; flex-direction: column; gap: 12px; }
        .option-label { 
            position: relative; display: flex; align-items: flex-start; padding: 16px; 
            background: white; border: 2px solid transparent; border-radius: 16px; 
            cursor: pointer; transition: all 0.25s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            color: var(--text-sub); font-size: 15px; line-height: 1.5;
        }
        .option-label input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
        /* 选中状态 */
        .option-label:has(input[type="radio"]:checked) {
            border-color: var(--primary-light);
            background: rgba(255, 117, 140, 0.05);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.15);
        }
        
        /* 兼容老版本浏览器的选中状态通过 JS 加 class 处理 */
        .option-label.selected {
            border-color: var(--primary-light);
            background: rgba(255, 117, 140, 0.05);
            color: var(--primary);
            font-weight: 600;
        }

        /* --- 加载界面 --- */
        #loading-screen { display: none; text-align: center; padding: 80px 10px; }
        .spinner { 
            width: 60px; height: 60px; border: 4px solid #f8cdda; border-top: 4px solid var(--primary); 
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 30px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-bar { 
            width: 100%; height: 8px; background: #f0e6e8; border-radius: 10px; margin-top: 30px; overflow: hidden; 
        }
        .progress-fill { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.3s ease; }

        /* --- 结果界面 --- */
        #result-screen { display: none; }
        .score-box { 
            background: white; padding: 30px 20px; border-radius: 20px; margin-bottom: 25px; 
            text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #fff5f7;
        }
        .score-number { font-size: 56px; font-weight: 900; color: var(--primary-light); line-height: 1; margin: 10px 0; font-family: -apple-system, sans-serif;}
        .percentile-text { font-size: 16px; color: var(--primary); font-weight: 600; background: #fff0f4; display: inline-block; padding: 6px 16px; border-radius: 20px;}
        
        .chart-wrapper { 
            background: white; border-radius: 20px; padding: 20px 15px; margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
        }
        .chart-title { text-align: center; font-size: 15px; font-weight: bold; color: var(--text-sub); margin-bottom: 15px; }
        .radar-container { position: relative; width: 100%; max-width: 350px; margin: 0 auto; aspect-ratio: 1/1;} /* 限制雷达图高度防拉伸 */

        .report-content { 
            background: white; padding: 25px 20px; border-radius: 20px; font-size: 15px; line-height: 1.8; 
            color: var(--text-main); box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .report-content h3 { color: var(--primary); margin-top: 0; font-size: 19px; border-bottom: 2px solid #fff0f4; padding-bottom: 10px;}
        
        /* 致命红线警示框 */
        .fatal-warning-box { 
            background: #fff5f5; border: 1px solid #ffd6d6; padding: 16px; border-radius: 12px; margin: 20px 0; 
        }
        .fatal-warning-box h4 { color: #d32f2f; margin: 0 0 10px 0; font-size: 16px; }
        .fatal-warning-box ul { margin: 0; padding-left: 20px; color: #c62828; font-weight: 600; line-height: 1.6;}

        /* 版权声明 */
        .copyright { position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 12px; color: #bcaaaef0; }

        /* PDF 导出时的降级类 (去除导致黑屏的高级特效) */
        .pdf-export-mode { box-shadow: none !important; backdrop-filter: none !important; background: #fffcfd !important; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>亲密关系深度评估系统</h1>
    <div class="subtitle">深度心理量表 v3.0 | 仅供授权用户使用</div>

    <!-- 验证界面 -->
    <div id="auth-screen">
        <div class="disclaimer-box">
            <strong>免责声明：</strong><br>
            本测试结果基于社会交换理论及心理行为模式生成，仅供情感复盘与自我觉察参考。测试过程完全私密，系统不会上传或记录您的个人信息。
        </div>

        <div class="lock-icon">🔐</div>
        <h2 style="color: var(--primary); font-size: 20px;">测试入口已锁定</h2>
        <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 25px;">请输入您的专属测试码以开启评估：</p>
        
        <input type="text" id="authCode" class="auth-input" placeholder="输入测试码...">
        <button id="authBtn" class="btn btn-pink-dark" onclick="verifyToken()">验证并开启测试</button>
    </div>

    <!-- 答题界面 -->
    <div id="quiz-screen">
        <div class="intro">
            <strong>⚠️ 填写指南：</strong>请摒弃主观光环，严格根据TA在现实生活中的<strong>真实日常表现</strong>作答，不要根据“承诺”或“偶尔的例外”来选择。
        </div>
        <form id="quizForm">
            <div id="questions-container"></div>
            <button type="button" id="submitBtn" class="btn btn-pink-dark" onclick="submitQuiz()">生成专属分析报告</button>
        </form>
    </div>

    <!-- 加载界面 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="color: var(--primary);">报告生成中...</h2>
        <div id="loading-text" style="color: var(--text-sub); font-size: 15px; margin-top: 15px; height: 20px;">正在汇总问卷数据...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- 结果界面 -->
    <div id="result-screen">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 22px;">📊 专属诊断报告</h2>
        
        <div class="score-box" id="scoreBox">
            <div style="color: var(--text-sub); font-size: 14px; font-weight: bold;">综合评估得分</div>
            <div class="score-number" id="scoreValue">0</div>
            <div class="percentile-text" id="percentileText">加载中...</div>
        </div>

        <div class="chart-wrapper">
            <div class="chart-title">【 样本市场竞争力分布 】</div>
            <canvas id="bellChart"></canvas>
        </div>

        <div class="chart-wrapper">
            <div class="chart-title" id="radarTitle">【 五维特质雷达透视图 】</div>
            <div class="radar-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <div class="report-content" id="reportContent"></div>

        <button id="downloadPdfBtn" class="btn btn-pink-light" onclick="generatePDF()" style="margin-top: 30px;">
            📄 保存为长图 (PDF)
        </button>
    </div>

    <div class="copyright">© 版权所有：测测看心理工作室</div>
</div>

<script>
    // 监听回车键验证
    document.addEventListener('DOMContentLoaded', function() {
        const authInput = document.getElementById('authCode');
        if (authInput) {
            authInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); 
                    verifyToken(); 
                }
            });
        }
    });

    // 题目数据 (保持原样)
    const rawQuestions = [
        { id: 1, dimIndex: 0, q: "TA目前的收入水平与职业前景如何？", options: [
            { text: "A. 收入丰厚且稳定，在同龄人中属于前列（如高薪、有分红等）。", score: 4 },
            { text: "B. 收入中等偏上，工作稳定，有清晰的涨薪或晋升空间。", score: 3 },
            { text: "C. 收入勉强够两人日常开销，缺乏明显规划和上进心。", score: 2 },
            { text: "D. 收入不稳定/待业，且经常好高骛远，天天做发财梦。", score: 1 }
        ]},
        { id: 2, dimIndex: 0, q: "关于房产、车辆等核心资产，TA的情况是：", options: [
            { text: "A. 已有房车且无压力，或已准备好充足首付及还贷能力。", score: 4 },
            { text: "B. 还在积累中，但有明确可行的买房储蓄计划，能共同承担。", score: 3 },
            { text: "C. 没有房车，且认为“租房也挺好”，或指望掏空父母钱包。", score: 2 },
            { text: "D. 不仅没有任何硬资产，还有非良性负债（网贷、消费贷等）。", score: 1 }
        ]},
        { id: 3, dimIndex: 0, q: "TA的日常消费观和财务习惯是怎样的？", options: [
            { text: "A. 有清晰的理财规划，量入为出，抗风险能力极强。", score: 4 },
            { text: "B. 偶尔冲动消费，但总体可控，不影响正常生活。", score: 3 },
            { text: "C. 典型的“月光族”，遇到急事完全拿不出钱。", score: 2 },
            { text: "D. 极度抠门（对你苛刻），或极度挥霍（自己透支消费）。", score: 1 }
        ]},
        { id: 4, dimIndex: 0, q: "TA在你身上花钱的态度是：", options: [
            { text: "A. 非常慷慨，能力范围内总想给你最好的，有仪式感。", score: 4 },
            { text: "B. 比较大方，日常开销不计较，大件物品会商量着买。", score: 3 },
            { text: "C. 算得很清楚，哪怕几十块钱的外卖也经常暗示要AA。", score: 2 },
            { text: "D. 经常向你哭穷，甚至要求你为TA的高额消费买单。", score: 1 }
        ]},
        { id: 5, dimIndex: 0, q: "面对突发大额支出（如生病、意外），TA的底气是：", options: [
            { text: "A. 有充足存款或商业保险，能从容应对遮风挡雨。", score: 4 },
            { text: "B. 有一定存款，虽会肉痛，但能硬撑着拿出钱解决。", score: 3 },
            { text: "C. 毫无抗风险能力，遇到大事只能四处借钱。", score: 2 },
            { text: "D. 没钱还会抱怨逃避，甚至把压力甩锅给你。", score: 1 }
        ]},
        { id: 6, dimIndex: 1, q: "当你受委屈向TA倾诉时，TA的反应是：", options: [
            { text: "A. 认真倾听，先安抚情绪，再帮你分析解决问题。", score: 4 },
            { text: "B. 会安慰几句，但很快试图讲大道理。", score: 3 },
            { text: "C. 心不在焉，边看手机边敷衍地“嗯、啊”。", score: 2 },
            { text: "D. 极度不耐烦，甚至反向指责你“天天抱怨烦不烦”。", score: 1 }
        ]},
        { id: 7, dimIndex: 1, q: "日常相处中，TA对你的用心程度如何？", options: [
            { text: "A. 细节控，能敏锐察觉情绪变化，记住你的喜好。", score: 4 },
            { text: "B. 总体比较关心，偶尔粗心大意，提醒后会改正。", score: 3 },
            { text: "C. 极其自我，永远把自己的感受排在第一位。", score: 2 },
            { text: "D. 漠不关心，连重要的纪念日都经常“忘记”。", score: 1 }
        ]},
        { id: 8, dimIndex: 1, q: "你们之间的亲密互动（非生理需求）频率如何？", options: [
            { text: "A. 经常有牵手、拥抱等亲昵动作，感觉被浓烈爱着。", score: 4 },
            { text: "B. 互动正常，总体让人感到踏实舒适。", score: 3 },
            { text: "C. 几乎没有日常身体接触，像极了“合租室友”。", score: 2 },
            { text: "D. 抗拒日常亲近，且在关系中极度自私，不顾及你的体验。", score: 1 }
        ]},
        { id: 9, dimIndex: 1, q: "当TA的朋友或家人在场时，TA是如何对待你的？", options: [
            { text: "A. 大方介绍，极度护短，分歧时坚定挡在你前面。", score: 4 },
            { text: "B. 表现自然，偶尔照顾不到你，事后会解释安抚。", score: 3 },
            { text: "C. “窝里横，外面装”，在外人面前呼来喝去彰显自己。", score: 2 },
            { text: "D. 故意隐瞒你的身份，或纵容亲友对你开恶劣玩笑。", score: 1 }
        ]},
        { id: 10, dimIndex: 1, q: "异地或不能见面时，TA的联系习惯是：", options: [
            { text: "A. 主动分享日常，事事有回应，给足安全感。", score: 4 },
            { text: "B. 每天基本会联系，能随时找到人。", score: 3 },
            { text: "C. 经常失联几小时，事后总以“太忙”为借口。", score: 2 },
            { text: "D. 动不动玩失踪，断联冷战，让你陷入内耗。", score: 1 }
        ]},
        { id: 11, dimIndex: 2, q: "发生激烈争吵时，TA展现出的底线是：", options: [
            { text: "A. 内核稳定，不翻旧账，不进行人身攻击。", score: 4 },
            { text: "B. 虽会上头，但在你掉眼泪或表达受伤后会停下来。", score: 3 },
            { text: "C. 擅长“冷暴力”，拒绝沟通，等你先低头。", score: 2 },
            { text: "D. 情绪易失控，摔东西、辱骂，甚至有动手倾向。", score: 1 }
        ]},
        { id: 12, dimIndex: 2, q: "吵架后的“修复期”，TA通常怎么做？", options: [
            { text: "A. 主动找台阶，真诚道歉并复盘，提供解决方案。", score: 4 },
            { text: "B. 会开玩笑糊弄过去，虽避重就轻但愿意和好。", score: 3 },
            { text: "C. 死鸭子嘴硬绝不认错，甚至反指责你。", score: 2 },
            { text: "D. 极度记仇，把每次吵架记下来时不时翻旧账。", score: 1 }
        ]},
        { id: 13, dimIndex: 2, q: "当TA自己遇到重大挫折（失业、亏损）时：", options: [
            { text: "A. 短暂低落后能迅速调整，展现极强韧性找寻出路。", score: 4 },
            { text: "B. 会向你倒苦水，但基本能维持正常生活节奏。", score: 3 },
            { text: "C. 彻底崩溃，长时间萎靡不振，负能量全排泄给你。", score: 2 },
            { text: "D. 将失败归咎外界，靠酗酒、网游等极度逃避现实。", score: 1 }
        ]},
        { id: 14, dimIndex: 2, q: "TA的日常情绪状态是怎样的？", options: [
            { text: "A. 开朗温和，自带高正能量，能治愈你的不开心。", score: 4 },
            { text: "B. 大部分平稳，偶尔有小脾气但很好哄。", score: 3 },
            { text: "C. 高敏感且多疑，常因小事陷入内耗让你压抑。", score: 2 },
            { text: "D. 情绪像过山车，喜怒无常，你在旁边总小心翼翼。", score: 1 }

    let shuffledQuestions = [];

    // 洗牌算法
    function shuffleArray(array) {
        let newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    async function verifyToken() {
        const inputCode = document.getElementById('authCode').value.trim().toUpperCase();
        if (!inputCode) { alert("请输入测试码！"); return; }

        const btn = document.getElementById('authBtn');
        btn.innerText = "系统验证中...";
        btn.disabled = true;

        try {
            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: inputCode })
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('quiz-screen').style.display = 'block';
                renderQuestions();
            } else {
                alert(result.message);
                btn.innerText = "验证并开启测试";
                btn.disabled = false;
            }
        } catch (error) {
            // 开发阶段/本地测试如果没有后端，取消下面注释可直接进入
            // document.getElementById('auth-screen').style.display = 'none';
            // document.getElementById('quiz-screen').style.display = 'block';
            // renderQuestions();
            // return;
            
            alert("网络请求失败，请稍后再试。");
            btn.innerText = "验证并开启测试";
            btn.disabled = false;
        }
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        shuffledQuestions = shuffleArray(rawQuestions);

        shuffledQuestions.forEach((item, index) => {
            let html = `<div class="question" id="q-block-${index}">
                            <h4><span style="color:var(--primary-light)">${index + 1}/25.</span> ${item.q}</h4>
                            <div class="options-wrapper">`;
            item.options.forEach((opt) => {
                html += `<label class="option-label" onclick="handleSelect(this, ${index})">
                            <input type="radio" name="q_${item.id}" value="${opt.score}">
                            <span>${opt.text}</span>
                         </label>`;
            });
            html += `</div></div>`;
            container.innerHTML += html;
        });
    }

    // 处理点选交互：选中高亮 + 自动滚动到下一题
    function handleSelect(labelElement, currentIndex) {
        // 移除同级其他label的选中样式 (兼容不支持:has的浏览器)
        const siblings = labelElement.parentElement.querySelectorAll('.option-label');
        siblings.forEach(el => el.classList.remove('selected'));
        labelElement.classList.add('selected');
        
        // 移除未答题红框警告
        const qBlock = document.getElementById(`q-block-${currentIndex}`);
        if(qBlock) qBlock.classList.remove('error-highlight');

        // 延迟200ms自动平滑滚动到下一题
        setTimeout(() => {
            const nextBlock = document.getElementById(`q-block-${currentIndex + 1}`);
            if (nextBlock) {
                nextBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 200);
    }

    let g_totalScore = 0, g_veto = false, g_dimScores = [0,0,0,0,0], g_vetoReasons = []; 

    function submitQuiz() {
        g_totalScore = 0; g_veto = false; g_dimScores = [0, 0, 0, 0, 0]; g_vetoReasons = [];
        let firstUnansweredIndex = -1;

        for (let i = 0; i < shuffledQuestions.length; i++) {
            let item = shuffledQuestions[i];
            const radios = document.getElementsByName('q_' + item.id);
            let answered = false;
            
            for (let radio of radios) {
                if (radio.checked) {
                    let score = parseInt(radio.value);
                    g_totalScore += score;
                    g_dimScores[item.dimIndex] += score;
                    answered = true;
                    if (item.isVeto && score === 1) {
                        g_veto = true;
                        g_vetoReasons.push(item.vetoReason);
                    }
                    break;
                }
            }
            if (!answered && firstUnansweredIndex === -1) {
                firstUnansweredIndex = i;
            }
        }

        // 如果有未答的题，定位并标红提示
        if (firstUnansweredIndex !== -1) {
            const targetBlock = document.getElementById(`q-block-${firstUnansweredIndex}`);
            targetBlock.classList.add('error-highlight');
            targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // 小震动动画体验更好
            setTimeout(() => alert(`您还有题目未作答，已为您自动定位到第 ${firstUnansweredIndex + 1} 题。`), 300);
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "数据处理中...";

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'block';
        window.scrollTo(0, 0);
        simulateLoading();
    }

    function simulateLoading() {
        const fill = document.getElementById('progress-fill');
        const text = document.getElementById('loading-text');
        const stages = ["正在汇总问卷数据...", "进行行为学模式比对...", "提取底层特征模型...", "计算综合百分比...", "生成最终专属报告..."];
        let progress = 0, stageIndex = 0;
        
        let interval = setInterval(() => {
            progress += Math.floor(Math.random() * 5) + 2; 
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                setTimeout(showResults, 500); 
            }
            fill.style.width = progress + '%';
            let expectedStage = Math.floor((progress / 100) * stages.length);
            if(expectedStage >= stages.length) expectedStage = stages.length - 1;
            if(expectedStage > stageIndex) {
                stageIndex = expectedStage;
                text.innerText = stages[stageIndex];
            }
        }, 100); 
    }

    function calculatePercentile(score) {
        if (g_veto) return 0.1; 
        if (score <= 35) return Math.max(1, score - 20); 
        if (score >= 90) return 96 + (score - 90) * 0.3; 
        if (score >= 75) return 75 + (score - 75) * 1.4; 
        if (score >= 60) return 30 + (score - 60) * 3;   
        return Math.max(5, (score - 25)); 
    }

    let bChart = null;
    function drawBellCurve(userScore, percentile) {
        const ctx = document.getElementById('bellChart').getContext('2d');
        if (bChart) bChart.destroy();
        let labels = [], data = [], pointColors = [], pointRadii = [];

        for(let i = 25; i <= 100; i++) {
            labels.push(i);
            let y = Math.exp(-Math.pow(i - 65, 2) / (2 * Math.pow(12, 2))) * 100; 
            data.push(y);
            if(i === userScore) {
                pointColors.push('#d81b60'); pointRadii.push(6);
            } else {
                pointColors.push('rgba(0,0,0,0)'); pointRadii.push(0);
            }
        }

        bChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '数据分布曲线',
                    data: data,
                    borderColor: '#ff758c', 
                    backgroundColor: 'rgba(255, 117, 140, 0.1)',
                    borderWidth: 2, fill: true, tension: 0.4, 
                    pointBackgroundColor: pointColors,
                    pointRadius: pointRadii,
                    pointHoverRadius: pointRadii
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { callback: function(val, index) { return index % 10 === 0 ? labels[index] : ''; } } },
                    y: { display: false } 
                },
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });
    }

    let rChart = null;
    function drawRadarChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (rChart) rChart.destroy();
        let finalRadarData = g_veto ? [0, 0, 0, 0, 0] : g_dimScores;
        let chartColor = g_veto ? 'rgba(211, 47, 47, 0.2)' : 'rgba(255, 117, 140, 0.2)';
        let borderColor = g_veto ? 'rgba(211, 47, 47, 1)' : 'rgba(255, 117, 140, 1)';

        rChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['生存底盘', '情感供给', '情绪稳定', '成长联盟', '底线品性'],
                datasets: [{
                    data: finalRadarData,
                    backgroundColor: chartColor,
                    borderColor: borderColor,
                    pointBackgroundColor: borderColor,
                    borderWidth: 2, fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    r: {
                        min: 0, max: 20,  
                        angleLines: { color: 'rgba(0,0,0,0.05)' }, grid: { color: 'rgba(0,0,0,0.05)' },
                        pointLabels: { font: { size: 12, weight: 'bold' }, color: g_veto ? '#d32f2f' : '#666' },
                        ticks: { display: false }
                    }
                },
                plugins: { legend: { display: false } }

        });

        btn.innerText = "⏳ 正在生成高清长图，请稍候...";
        btn.disabled = true;
        
        // 关键：暂时移除毛玻璃和高级阴影，防止 iOS 微信浏览器 html2canvas 渲染崩溃/黑屏
        container.classList.add('pdf-export-mode');
        window.scrollTo(0, 0);
        btn.style.display = 'none';

        try {
            const canvas = await html2canvas(container, {
                scale: 2, 
                useCORS: true,
                backgroundColor: '#fdf3f6' // 强制白底粉色避免透明黑图
            });
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const { jsPDF } = window.jspdf;
            const pdfWidth = 210; 
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width; 
            const pdf = new jsPDF('p', 'mm', [pdfWidth, pdfHeight]);
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`伴侣深度评估报告_${new Date().getTime()}.pdf`);
            
        } catch (error) {
            console.error(error);
            alert("生成长图失败，可能是手机内存不足，请尝试截图保存。");
        } finally {
            // 恢复高级 UI
            container.classList.remove('pdf-export-mode');
            btn.style.display = 'block';
            btn.innerText = "📄 保存为长图 (PDF)";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
